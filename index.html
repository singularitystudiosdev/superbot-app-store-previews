<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Superbot App Store assets</title>
<link rel="icon" href="assets/favicon.svg" />
<!-- The published asset set: the App Store header banner and the five
     iPhone screenshots (purple headline accent), each downloadable, plus
     one zip of all six. -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f5f7;
    font: 15px/1.47 -apple-system, system-ui, "Helvetica Neue", sans-serif;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1500px; margin: 0 auto; padding: 48px 32px 96px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  h1 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px; }
  h2 { margin: 48px 0 16px; font-size: 17px; line-height: 22px; font-weight: 700; }
  .zip, .get { color: #0066cc; text-decoration: none; font-weight: 600; }
  .zip { padding: 8px 16px; border-radius: 999px; background: #0071e3; color: #fff; }
  .zip:hover { background: #0077ed; }
  .get:hover { text-decoration: underline; }
  .header img { display: block; width: 100%; height: auto; border-radius: 12px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: #6e6e73; }
  .shots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; list-style: none; }
  .shots img { display: block; width: 100%; height: auto; border-radius: 12.8% / 5.7%; }
  @media (max-width: 900px) { .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Superbot App Store assets</h1>
      <a class="zip" href="assets/superbot-app-store-assets.zip" download>Download all (.zip)</a>
    </div>

    <section class="header" aria-labelledby="header-title">
      <h2 id="header-title">Header</h2>
      <img src="assets/superbot-header.png" alt="Superbot App Store header: icon, name, subtitle and Share on a purple sheen" width="3000" height="572" />
      <p class="meta"><span>superbot-header.png · 3000 × 572</span><a class="get" href="assets/superbot-header.png" download>Download</a></p>
    </section>

    <section aria-labelledby="shots-title">
      <h2 id="shots-title">iPhone screenshots</h2>
      <ul class="shots">
        <li><img src="assets/1-direct-answers.png" alt="Direct Answers" width="1290" height="2796" /><p class="meta"><span>1290 × 2796</span><a class="get" href="assets/1-direct-answers.png" download>Download</a></p></li>
        <li><img src="assets/2-switches-models.png" alt="Switches Models" width="1290" height="2796" /><p class="meta"><span>1290 × 2796</span><a class="get" href="assets/2-switches-models.png" download>Download</a></p></li>
        <li><img src="assets/3-does-anything.png" alt="Does Anything" width="1290" height="2796" /><p class="meta"><span>1290 × 2796</span><a class="get" href="assets/3-does-anything.png" download>Download</a></p></li>
        <li><img src="assets/4-your-plans.png" alt="Your Plans" width="1290" height="2796" /><p class="meta"><span>1290 × 2796</span><a class="get" href="assets/4-your-plans.png" download>Download</a></p></li>
        <li><img src="assets/5-free-publish.png" alt="Free publish" width="1290" height="2796" /><p class="meta"><span>1290 × 2796</span><a class="get" href="assets/5-free-publish.png" download>Download</a></p></li>
      </ul>
    </section>
  </main>
</body>
</html>
