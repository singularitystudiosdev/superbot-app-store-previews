<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genie: ask the magic 8 ball</title>
<link rel="icon" href="../../art/variants/genie-v3-glass.png" />
<style>
  /* Genie's site, in the hero art's palette (art/genie-hero.png): night
     purple, violet smoke, lamp gold. */
  :root {
    --night: #160a2e;
    --violet: #b38cff;
    --lilac: #e4d6ff;
    --gold: #f2c35a;
    --muted: #b9a8dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    background: var(--night);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  /* The genie fills the right of the page and fades into the night on the left. */
  .hero-art {
    position: absolute;
    inset: 0 0 0 auto;
    width: 74%;
    background: url("../../art/genie-hero.png") center / cover no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 34%);
  }
  nav { position: relative; display: flex; align-items: center; gap: 36px; padding: 28px 64px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  nav .links { display: flex; gap: 32px; margin-left: auto; }
  nav a { color: var(--lilac); font-size: 16px; text-decoration: none; }
  .pill { padding: 12px 22px; border-radius: 999px; background: var(--gold); color: #2a1650; font-weight: 700; font-size: 16px; text-decoration: none; }
  nav .pill { color: #2a1650; }

  main { position: relative; max-width: 560px; padding: 120px 64px 0; }
  h1 { font-size: 72px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 800; }
  h1 span { color: var(--violet); }
  .lede { margin-top: 22px; max-width: 28ch; font-size: 21px; line-height: 1.45; color: var(--muted); }
  .ctas { display: flex; gap: 14px; margin-top: 34px; }
  .ghost { padding: 12px 22px; border-radius: 999px; border: 2px solid var(--violet); color: var(--lilac); font-weight: 600; font-size: 16px; text-decoration: none; }
</style>
</head>
<body>
  <div class="hero-art" role="img" aria-label="A purple genie rising from a golden lamp, holding a magic 8 ball"></div>
  <nav>
    <span class="brand"><img src="../../art/variants/genie-v3-glass.png" alt="" />Genie</span>
    <span class="links"><a href="#how">How it works</a><a href="#answers">Answers</a><a href="#faq">FAQ</a></span>
    <a class="pill" href="#download">Download</a>
  </nav>
  <main>
    <h1>Ask a question.<br /><span>Get your answer.</span></h1>
    <p class="lede">Shake your phone and the Genie answers, the way a magic 8 ball does.</p>
    <div class="ctas"><a class="pill" href="#download">Download for iPhone</a><a class="ghost" href="#how">See how it works</a></div>
  </main>
</body>
</html>
